name: Transfer source archive

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: agni-source-archive
          path: gas-management-main.zip
          if-no-files-found: error
          retention-days: 1
